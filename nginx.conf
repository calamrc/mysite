# Nginx configuration for serving Vue.js SPA
# Place this in your Nginx configuration directory

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Path to your Vue.js dist directory
    root /path/to/your/frontend/dist;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Handle static assets with caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle all routes (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;

        # Cache the index.html for a short time
        location ~* ^/index\.html$ {
            expires 10m;
            add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        }
    }

    # API proxy to Flask backend
    location /api {
        proxy_pass http://localhost:5000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable cookies and credentials
        proxy_cookie_domain localhost yourdomain.com;
    }

    # Health check
    location /health {
        proxy_pass http://localhost:5000/health;
        access_log off;
    }

    # Error pages
    error_page 404 /index.html;
}
